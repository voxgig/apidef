# Publishes @voxgig/apidef to npm on a `v*` tag push, via GitHub OIDC
# Trusted Publishing — no NPM_TOKEN secret. The `id-token: write`
# permission lets npm exchange a GitHub OIDC token for a short-lived
# publish credential, and provenance is attached automatically.
#
# The trusted publisher must be registered on npmjs.com for
# voxgig/apidef against THIS filename (publish.yml); renaming this file
# breaks publishing until the npm-side config is updated to match.
#
# The npm package lives in ts/ (ts/ and go/ are self-contained
# per-language projects), so all steps run there.
#
# Release flow: bump ts/package.json, merge to main, then push a v* tag.
# Do NOT run `npm run repo-publish` locally — it publishes over a token
# and bypasses OIDC entirely.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # package-lock.json is committed here, so ci is safe and reproducible.
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public
