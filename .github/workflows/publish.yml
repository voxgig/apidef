# Releases @voxgig/apidef: publishes to npm AND writes both git tags.
#
# ONE FILE, BECAUSE NPM ALLOWS EXACTLY ONE. A trusted publisher is registered
# on npmjs.com against a single workflow FILENAME. The name itself is
# arbitrary — other repos register `release.yml` and publish from it happily —
# but only the ONE registered file can publish, so anything that must
# accompany a publish has to live inside it. Here that is the tags.
#
# A second workflow cannot publish whatever permissions it holds; npm rejects
# the exchange and reports it as
#
#   npm error 404 Not Found - PUT https://registry.npmjs.org/@voxgig%2fapidef
#
# — a 404, not a 403, so as not to leak whether the package exists.
#
# TWO JOBS, BECAUSE THEY NEED DIFFERENT PRIVILEGES.
#
#   publish  id-token: write, contents: READ. Runs npm ci, the build and the
#            tests — i.e. dependency lifecycle scripts and project code.
#   tag      contents: write. Runs git and nothing else.
#
# Keeping them in one job would hand a repository-write credential to every
# dependency postinstall script that runs during `npm ci`, because checkout
# persists its token into the git config for the whole job. The publishing
# job therefore keeps the `contents: read` it has always had, and the write
# credential exists only in a job that installs nothing.
#
# A ref pushed with GITHUB_TOKEN does NOT start another workflow run (GitHub
# suppresses that so workflows cannot trigger themselves), so the tag job
# cannot be replaced by "tag and let the publisher fire on it".
#
# TWO WAYS IN:
#
#   workflow_dispatch  the normal path. Publishes what is missing, then tags.
#   push: tags v*      the manual path, for a tag pushed by hand. Publishes
#                      only; the tag job does not run.
#
# VERSION BUMPS ARE NOT AUTOMATED, deliberately. Nothing here commits. It
# reads the versions already on the branch and releases exactly those, so the
# bump stays a reviewable diff and the release stays a button.
#
#   npm   ts/package.json "version"     -> tag v<version>
#   go    go/apidef.go    const VERSION -> tag go/v<version>
#
# Go modules have no registry step: the tag IS the release. proxy.golang.org
# caches a module version immutably, so a wrong go/vX.Y.Z cannot be fixed by
# re-pushing it — bump to the next patch instead.
#
# Renaming this file breaks publishing until the npm-side trusted publisher is
# updated to match. Do NOT run `npm run repo-publish` locally: it publishes
# over a token and bypasses OIDC entirely.
#
# See docs/how-to/release-and-tag.md.

name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm:
        description: 'Publish the npm package and tag v<version>'
        type: boolean
        default: true
      go:
        description: 'Tag the Go module go/v<VERSION>'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deliberately NOT contents: write — see the header. This job runs
    # dependency lifecycle scripts.
    permissions:
      id-token: write
      contents: read

    outputs:
      npm_version: ${{ steps.versions.outputs.npm_version }}
      go_version: ${{ steps.versions.outputs.go_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the versions being released
        id: versions
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./ts/package.json').version")"
          GO_VERSION="$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' go/apidef.go)"

          test -n "$NPM_VERSION" || { echo "::error::could not read ts/package.json version"; exit 1; }
          test -n "$GO_VERSION"  || { echo "::error::could not read VERSION from go/apidef.go"; exit 1; }

          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION"   >> "$GITHUB_OUTPUT"
          echo "npm: $NPM_VERSION -> v$NPM_VERSION"
          echo "go:  $GO_VERSION -> go/v$GO_VERSION"

      # A tag pushed by hand must agree with the version it claims to release.
      # Without this, pushing v7.3.0 while ts/package.json still says 7.2.0
      # resolves 7.2.0, finds it already published, skips the publish, and the
      # run goes GREEN — leaving a v7.3.0 tag with no npm release behind it.
      - name: The pushed tag must match the package version
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          WANT="v${{ steps.versions.outputs.npm_version }}"
          if [ "$GITHUB_REF_NAME" != "$WANT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ts/package.json ($WANT)"
            exit 1
          fi

      # AN EXISTING TAG IS ONLY A PROBLEM IF IT POINTS SOMEWHERE ELSE.
      #
      # Refusing every existing tag broke the recovery this workflow promises:
      # if the npm tag was written and the Go tag push then failed, a
      # re-dispatch was refused before it could retry the missing one — and a
      # Go-only release was impossible whenever the npm version was already
      # tagged. A tag already on THIS commit is the idempotent case: nothing
      # to do, not an error. A tag on a different commit means the version was
      # not bumped, and moving it would rewrite a published release.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          fail=0

          check() {
            local tag="$1" what="$2"
            local at
            at="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
            if [ -n "$at" ] && [ "$at" != "$HEAD_SHA" ]; then
              echo "::error::tag $tag already exists on $at, not this commit — bump $what"
              return 1
            fi
            if [ -n "$at" ]; then
              echo "$tag already points here; nothing to create"
            fi
            return 0
          }

          if [ "${{ inputs.npm }}" = "true" ]; then
            check "v${{ steps.versions.outputs.npm_version }}" "ts/package.json" || fail=1
          fi
          if [ "${{ inputs.go }}" = "true" ]; then
            check "go/v${{ steps.versions.outputs.go_version }}" "VERSION in go/apidef.go" || fail=1
          fi
          exit $fail

      - name: Check the model mirrors are in sync
        run: make check-model

      - name: Build and test TypeScript
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm test

      # build.yml does not cover Go on pushes or PRs, so this is the only
      # automated gate between a Go change and a tagged module release.
      - name: Build and test Go
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.go }}
        working-directory: go
        run: |
          go version
          go build ./...
          go test ./... -count=1

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag. A run can publish and then fail before tagging, leaving a version
      # on npm with nothing pointing at it. Without this check that state is
      # unrecoverable: the publish step dies on "cannot publish over the
      # previously published versions" before the tag job ever runs.
      - name: Is this version already on npm?
        id: registry
        run: |
          set -euo pipefail
          V="${{ steps.versions.outputs.npm_version }}"
          if npm view "@voxgig/apidef@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$V is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$V is not on npm — will publish"
          fi

      # Publish BEFORE tagging (the tag job `needs` this one), so a tag only
      # ever exists for a release that reached the registry.
      - name: Publish to npm
        if: ${{ (github.event_name == 'push' || inputs.npm) && steps.registry.outputs.published == 'false' }}
        working-directory: ts
        run: npm publish --access public

  # Runs git and nothing else. No npm install, no project code — so the
  # repository-write credential is never in scope while third-party code runs.
  tag:
    name: tag
    needs: publish
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Creating a tag that already points here is a no-op, not a failure:
      # that is what makes re-dispatching after a partial release safe.
      - name: Tag the npm release
        if: ${{ inputs.npm }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.publish.outputs.npm_version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the Go module
        if: ${{ inputs.go }}
        run: |
          set -euo pipefail
          TAG="go/v${{ needs.publish.outputs.go_version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
