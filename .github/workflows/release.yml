# One dispatch releases this repo: npm publish AND both git tags.
#
# WHY THIS EXISTS, AND WHY IT IS NOT PART OF publish.yml
#
# OIDC cannot create a tag. Trusted publishing exchanges a GitHub-issued
# OIDC token for a short-lived credential AT NPM — its audience is the
# registry, and it grants publish rights on a package. Writing a git ref is
# a GitHub operation under a different authority. That authority is the
# per-run GITHUB_TOKEN, and it is the same trust model: short-lived,
# scoped to one run, no stored secret. It just needs asking for, via
# `contents: write` below (publish.yml deliberately keeps `contents: read`).
#
# THE RECURSION GUARD IS WHY BOTH HALVES LIVE IN ONE JOB. A ref pushed with
# GITHUB_TOKEN does NOT start another workflow run — GitHub suppresses that
# to stop workflows triggering themselves. So "tag here, let publish.yml
# fire on the v* tag" silently publishes NOTHING. This workflow therefore
# publishes to npm itself and tags afterwards, in one run.
#
# publish.yml stays as it is: still the tag-driven path for a human pushing
# a v* tag by hand, and still dispatchable on its own. The two cannot
# double-publish — npm refuses to republish an existing version, which is a
# safe way to fail.
#
# VERSION BUMPS ARE NOT AUTOMATED, DELIBERATELY. This workflow never commits.
# It reads the versions already committed and releases exactly those, so the
# bump stays a reviewable diff in a PR and the release stays a button.
#
#   npm    ts/package.json  "version"      -> tag v<version>
#   go     go/apidef.go     const VERSION  -> tag go/v<version>
#
# Go modules have no registry step: the tag IS the release, which is why the
# Go half is tag-only.

name: release

on:
  workflow_dispatch:
    inputs:
      npm:
        description: 'Publish the npm package and tag v<version>'
        type: boolean
        default: true
      go:
        description: 'Tag the Go module go/v<VERSION>'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write   # create tags (GITHUB_TOKEN, not OIDC)
      id-token: write   # npm trusted publishing (OIDC)

    steps:
      # fetch-depth 0 so the existing tags are present to check against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the versions being released
        id: versions
        run: |
          set -euo pipefail
          NPM_VERSION="$(node -p "require('./ts/package.json').version")"
          GO_VERSION="$(sed -n 's/^const VERSION = "\(.*\)"$/\1/p' go/apidef.go)"

          test -n "$NPM_VERSION" || { echo "::error::could not read ts/package.json version"; exit 1; }
          test -n "$GO_VERSION"  || { echo "::error::could not read VERSION from go/apidef.go"; exit 1; }

          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION"   >> "$GITHUB_OUTPUT"
          echo "npm: $NPM_VERSION -> v$NPM_VERSION"
          echo "go:  $GO_VERSION -> go/v$GO_VERSION"

      # Fail before doing anything irreversible. A tag that already exists
      # means the version was not bumped, and re-releasing over it would
      # either be refused later or, worse, move a published tag.
      - name: Refuse to reuse an existing tag
        run: |
          set -euo pipefail
          fail=0
          if [ "${{ inputs.npm }}" = "true" ]; then
            if git rev-parse -q --verify "refs/tags/v${{ steps.versions.outputs.npm_version }}" >/dev/null; then
              echo "::error::tag v${{ steps.versions.outputs.npm_version }} already exists — bump ts/package.json"
              fail=1
            fi
          fi
          if [ "${{ inputs.go }}" = "true" ]; then
            if git rev-parse -q --verify "refs/tags/go/v${{ steps.versions.outputs.go_version }}" >/dev/null; then
              echo "::error::tag go/v${{ steps.versions.outputs.go_version }} already exists — bump VERSION in go/apidef.go"
              fail=1
            fi
          fi
          exit $fail

      - name: Check the model mirrors are in sync
        run: make check-model

      - name: Build and test TypeScript
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm test

      # The Go port is not covered by build.yml, so this is the only gate
      # standing between a Go change and a tagged module release. Uses the
      # runner's preinstalled Go rather than adding another action to pin.
      - name: Build and test Go
        if: ${{ inputs.go }}
        working-directory: go
        run: |
          go version
          go build ./...
          go test ./... -count=1

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        if: ${{ inputs.npm }}
        run: npm install -g npm@latest

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag. publish.yml can publish without tagging, so a version can be on
      # npm with no tag pointing at it — which is exactly the state 7.2.0 was
      # left in. Without this check that state is unrecoverable here: the
      # publish step would fail on "cannot publish over the previously
      # published versions" and the run would die before tagging it.
      #
      # So: publish only what is missing, and let the tag step run either
      # way. That makes a dispatch idempotent and lets this workflow
      # reconcile a half-finished release instead of refusing it.
      - name: Is this version already on npm?
        if: ${{ inputs.npm }}
        id: registry
        run: |
          set -euo pipefail
          V="${{ steps.versions.outputs.npm_version }}"
          if npm view "@voxgig/apidef@$V" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$V is already on npm — skipping publish, tagging only"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$V is not on npm — will publish"
          fi

      # Publish BEFORE tagging: a tag should only ever exist for a release
      # that actually reached the registry. If this fails, no tag is written
      # and the dispatch can simply be retried.
      - name: Publish to npm
        if: ${{ inputs.npm && steps.registry.outputs.published == 'false' }}
        working-directory: ts
        run: npm publish --access public

      - name: Tag the npm release
        if: ${{ inputs.npm }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.versions.outputs.npm_version }}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the Go module
        if: ${{ inputs.go }}
        run: |
          set -euo pipefail
          TAG="go/v${{ steps.versions.outputs.go_version }}"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
